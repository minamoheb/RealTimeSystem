services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rts-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: ${SA_PASSWORD:-Str0ng!Passw0rd123}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/RealTimeSystem.WebAPI/Dockerfile
    container_name: rts-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__ApplyMigrations: "true"
      Seed__Enabled: "true"
      ConnectionStrings__SqlServer: "Server=db,1433;Database=RealTimeMonitoring;User Id=sa;Password=${SA_PASSWORD:-Str0ng!Passw0rd123};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:-change-this-production-key-to-a-long-random-string}
      Cors__Origins__0: http://localhost:4200
      Cors__Origins__1: http://localhost:8088
      Hangfire__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - monitoring-data:/app/App_Data

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rts-web
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  monitoring-data:
  sqlserver-data:

<div class="shell">
  <aside>
    <a class="brand" routerLink="/dashboard">
      <span>RT</span>
      <div>
        <strong>Observatory</strong>
        <small>Fleet monitor</small>
      </div>
    </a>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Overview</a>
      <a routerLink="/alerts" routerLinkActive="active">Alerts</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
      <a routerLink="/jobs" routerLinkActive="active">Jobs</a>
      @if (auth.isAdmin()) {
        <a routerLink="/users" routerLinkActive="active">Users</a>
      }
    </nav>
    <button type="button" class="ghost" (click)="toggleTheme()">{{ theme() === 'dark' ? 'Light theme' : 'Dark theme' }}</button>
  </aside>
  <section>
    <header class="topbar">
      <div class="presence">
        <i [class.on]="store.connected()"></i>
        {{ store.connected() ? 'Live' : 'Connecting' }}
        <span>{{ store.presence().length }} online</span>
      </div>
      <div class="who">
        <strong>{{ auth.user()?.fullName }}</strong>
        <button type="button" (click)="logout()">Sign out</button>
      </div>
    </header>
    <main>
      <router-outlet />
    </main>
  </section>
</div>
